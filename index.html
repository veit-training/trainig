<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#eceef0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Trainings-Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: App mit unterer Tab-Leiste (Home, Training, Plan, Statistik, Verlauf), eine Spalte bis 600px.
   Home ist ein Dashboard: Wochenleiste, Tageskarte, Kennzahlen, Muskeln & Erholung, Bestleistungen, letzte Trainings.
   Standard ist dunkel (Schwarz + Kreidegrau); Hell und System sind in „Daten & Design“ wählbar. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --surface:#111214;
  --raise:#1b1d20;
  --line:#2b2e33;
  --ink:#eceef0;
  --mute:#9298a0;
  --chalk:#d9dde1;
  --on-chalk:#0b0c0e;
  --pos:#8fd6a6;
  --pos-bg:rgba(143,214,166,.13);
  --warn:#f0c56c;
  --warn-bg:rgba(240,197,108,.14);
  --neg:#ef8a70;
  --neg-bg:rgba(239,138,112,.14);
  --area:rgba(217,221,225,.10);
  --track:rgba(140,146,154,.28);
  --shadow:0 12px 32px rgba(0,0,0,.65);
  --scrim:rgba(0,0,0,.6);
  --f-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
  --r-s:10px;
  --tab-h:62px;
}
:root[data-look="light"]{
  color-scheme:light;
  --bg:#f1f2f4;--surface:#ffffff;--raise:#eceef1;--line:#d8dbe0;--ink:#121417;--mute:#596069;
  --chalk:#1b1e22;--on-chalk:#ffffff;--pos:#1d7544;--pos-bg:rgba(29,117,68,.10);--warn:#8a5d00;--warn-bg:rgba(138,93,0,.10);
  --neg:#b3422a;--neg-bg:rgba(179,66,42,.10);--area:rgba(27,30,34,.08);--track:rgba(90,96,105,.22);
  --shadow:0 12px 32px rgba(20,24,28,.18);--scrim:rgba(20,24,28,.35);
}
@media (prefers-color-scheme: light){
  :root[data-look="auto"]:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f1f2f4;--surface:#ffffff;--raise:#eceef1;--line:#d8dbe0;--ink:#121417;--mute:#596069;
    --chalk:#1b1e22;--on-chalk:#ffffff;--pos:#1d7544;--pos-bg:rgba(29,117,68,.10);--warn:#8a5d00;--warn-bg:rgba(138,93,0,.10);
    --neg:#b3422a;--neg-bg:rgba(179,66,42,.10);--area:rgba(27,30,34,.08);--track:rgba(90,96,105,.22);
    --shadow:0 12px 32px rgba(20,24,28,.18);--scrim:rgba(20,24,28,.35);
  }
}
:root[data-look="auto"][data-theme="light"]{
  color-scheme:light;
  --bg:#f1f2f4;--surface:#ffffff;--raise:#eceef1;--line:#d8dbe0;--ink:#121417;--mute:#596069;
  --chalk:#1b1e22;--on-chalk:#ffffff;--pos:#1d7544;--pos-bg:rgba(29,117,68,.10);--warn:#8a5d00;--warn-bg:rgba(138,93,0,.10);
  --neg:#b3422a;--neg-bg:rgba(179,66,42,.10);--area:rgba(27,30,34,.08);--track:rgba(90,96,105,.22);
  --shadow:0 12px 32px rgba(20,24,28,.18);--scrim:rgba(20,24,28,.35);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  --pb:96px;
  padding-block:8px calc(var(--pb) + env(safe-area-inset-bottom,0px));
}
body.has-dock{--pb:172px}
body.has-timer{--pb:196px}
body.has-dock.has-timer{--pb:268px}
body.has-sheet{overflow:hidden}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.m{color:var(--mute)}
.lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Kopf je Ansicht */
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 4px}
.vhead>div{min-width:0}
.eyebrow{margin:0 0 4px;font-size:14px;color:var(--mute)}
.vhead h1{font:700 30px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.gear{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.gear .sdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--mute);box-shadow:0 0 0 2px var(--surface)}
.gear[data-s="ok"] .sdot{background:var(--pos)}
.gear[data-s="pending"] .sdot,.gear[data-s="loading"] .sdot{background:var(--chalk);animation:blink 1s ease-in-out infinite}
.gear[data-s="err"] .sdot{background:var(--neg)}
.gear[data-s="err"]{border-color:var(--neg)}
@keyframes blink{50%{opacity:.25}}

/* Untere Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabbar button{height:var(--tab-h);min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--mute);font:600 11px/1 var(--f-body);letter-spacing:.01em;cursor:pointer;padding:0}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--ink)}
.tabbar button[aria-current="page"] .tbi{background:var(--raise)}
.tbi{display:flex;align-items:center;justify-content:center;width:42px;height:28px;border-radius:14px}

/* Segmente */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1 1 0;min-width:0;min-height:40px;padding:0 4px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:600 15px/1.1 var(--f-display);letter-spacing:.01em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--on-chalk)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.seg.two button{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.seg.two small{font:500 12px/1.15 var(--f-body);opacity:.85}
.seg.sm button{font-size:14px;min-height:36px}

/* Grundbausteine */
main{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.ch h2{font:700 19px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.ch .m{font-size:13px}
.lnk{border:0;background:none;padding:4px 0;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.1;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--chalk);border-color:var(--chalk);color:var(--on-chalk)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.lg{min-height:50px;font-size:16.5px}
.btn.wide{width:100%}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);min-height:44px;padding:0 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--chalk);outline-offset:0;border-color:transparent}
input::placeholder{color:var(--mute);opacity:.8}
input[disabled]{opacity:.45}
input.bad{border-color:var(--neg);color:var(--neg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.now{background:var(--chalk);border-color:var(--chalk);color:var(--on-chalk)}
.pill.ok{color:var(--pos);border-color:transparent;background:var(--pos-bg)}
.pill.warn{color:var(--warn);border-color:transparent;background:var(--warn-bg)}
.pill.neg{color:var(--neg);border-color:transparent;background:var(--neg-bg)}
.pill.sk{border-style:dashed}
.pill .dt{width:7px;height:7px;border-radius:50%;background:currentColor}
.up{color:var(--pos);font-weight:600}
.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg);font-weight:600}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--chalk);color:var(--on-chalk);border-color:var(--chalk)}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:var(--raise);font-size:13px;font-weight:500;color:var(--ink)}

/* Home: Wochenleiste */
.hstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;min-width:0}
.hday b{font:700 19px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.hday i{width:6px;height:6px;border-radius:50%;background:transparent}
.hday.tr i{background:var(--pos)}
.hday.sk i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mute)}
.hday.off{opacity:.6}
.hday.td{border-color:var(--mute)}
.hday[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--on-chalk);opacity:1}
.hday[aria-pressed="true"] b{color:var(--on-chalk)}
.hday[aria-pressed="true"].tr i{background:var(--on-chalk)}
.hsum{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mute);padding:8px 2px 0}
.hsum b{color:var(--ink)}

/* Home: Tageskarte */
.hero{display:flex;flex-direction:column;gap:14px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero h2{font:700 27px/1.02 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.prev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prev li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.prev li:first-child{border-top:0;padding-top:0}
.prev li span:first-child{min-width:0;overflow-wrap:anywhere}
.prev li span:last-child{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.rest{display:flex;gap:14px;align-items:center}
.rest .ri{flex:none;width:52px;height:52px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--chalk)}
.rest p{margin:0}
.nextw{background:var(--raise);border-radius:var(--r-s);padding:12px 14px;font-size:14.5px}
.nextw b{display:block;margin-top:2px}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:11px}
.tile .tv{font:700 26px/1 var(--f-body);letter-spacing:-.01em}
.tile .ts{font-size:12.5px;color:var(--mute);line-height:1.25}
.tile .tvr{display:flex;align-items:center;gap:8px}
.tile.mt{padding:10px 12px;gap:4px}
.tile.mt .tv{font-size:19px}
.hero .tile.mt{background:var(--raise);border-color:transparent}
.cgroup{margin-top:16px}
.ring{display:block}
.ring .rt{fill:none;stroke:var(--track);stroke-width:5}
.ring .rv{fill:none;stroke:var(--pos);stroke-width:5;stroke-linecap:round}
.flame{color:var(--warn)}

/* Muskeln & Erholung */
.musc{display:flex;flex-direction:column;gap:12px}
.mrow2{display:flex;flex-direction:column;gap:6px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mtop b{font-weight:600;font-size:15px}
.mbar{position:relative;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.mbar .band{position:absolute;top:0;bottom:0;background:var(--area);border-left:1px solid var(--mute);border-right:1px solid var(--mute)}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--chalk)}
.mval{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}

/* Listen: Bestleistungen, letzte Trainings */
.rl{display:flex;flex-direction:column}
.rl>*{border-top:1px solid var(--line)}
.rl>*:first-child{border-top:0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;align-items:center}
.rrow:first-child{padding-top:0}
.rrow b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.rrow small{font-size:13px;color:var(--mute)}
.rrow .rv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow .rv small{display:block;font-weight:500}
.rrow>span{display:block;min-width:0}
.rbtn{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;border-top:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.rl>.rbtn:first-child{border-top:0}
.rbtn:hover b{text-decoration:underline;text-underline-offset:3px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
.sumtxt{width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--raise);color:var(--ink);font:14px/1.45 var(--f-body);resize:vertical}
.wrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;cursor:pointer}
.rl>.wrow:first-child{padding-top:0}
.dbox{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;border-radius:12px;background:var(--raise)}
.dbox b{font:700 20px/1 var(--f-display)}
.dbox small{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.wrow .wn{min-width:0}
.wrow .wn b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.wrow .wn small{font-size:13px;color:var(--mute)}
.wrow .wv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrow .wv small{display:block;font-weight:500;color:var(--mute);font-size:12.5px}

/* Körpergewicht */
.bwtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bwv{font:700 34px/1 var(--f-body);letter-spacing:-.01em}
.bwv small{font-size:16px;font-weight:600;color:var(--mute);margin-left:4px}
.bwin{display:flex;gap:8px;margin-top:12px}
.bwin input{flex:1}

/* Erfolge */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acb{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--raise);min-width:0}
.acb .ai{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--mute);color:var(--mute);flex:none}
.acb.on .ai{background:var(--chalk);border-color:var(--chalk);color:var(--on-chalk)}
.acb b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.acb small{display:block;font-size:12px;color:var(--mute);line-height:1.25;margin-top:2px}
.acb:not(.on) b{color:var(--mute)}
.aprog{height:4px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}
.aprog i{display:block;height:100%;background:var(--chalk)}
.nexta{display:flex;flex-direction:column;gap:8px}
.nexta .aprog{height:6px;border-radius:3px}

/* Plan */
.day{display:flex;flex-direction:column;gap:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h3{font:700 23px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.dh p{margin:4px 0 0;font-size:14px}
.day.today{border-color:var(--mute)}
.exl{list-style:none;margin:0;padding:0}
.exl li{border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.exr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;background:none;border:0;text-align:left;cursor:pointer}
.exn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.exn>span{font-weight:600;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.exn small{font-size:13px;color:var(--mute);line-height:1.3}
.exn small.up{color:var(--pos)}
.tgt{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.ic{color:var(--chalk);flex:none}
.how{background:var(--raise);border-radius:var(--r-s);padding:12px 14px;margin:0 0 10px;font-size:14.5px;display:flex;flex-direction:column;gap:10px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:62ch}
.how p{margin:0}
.how a{font-size:14px;font-weight:600}
.figs{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--mute)}
.figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.figs svg{color:var(--chalk);background:var(--surface);border-radius:10px;display:block}
.figs figcaption{font-size:12px;color:var(--mute)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;max-width:62ch}
.rules b{font-weight:600}

/* Training */
.datebar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.datebar .btn{min-width:52px;font-size:20px}
.dtmid{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.dtmid b{font:700 21px/1 var(--f-display);letter-spacing:.02em}
.banner{background:var(--raise);border:1px solid var(--mute);border-radius:var(--r-s);padding:10px 12px;font-size:14px;line-height:1.35}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbar input[type="date"]{flex:1 1 170px;width:auto}
.titl{display:flex;flex-direction:column;gap:3px;padding:2px 2px 0}
.titl h2{font:700 25px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
.titl p{margin:0;font-size:14px;color:var(--mute)}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.quick .lbl{margin-right:4px}
.ex{display:flex;flex-direction:column}
.exh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exbtn{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;flex:1}
.exbtn b{display:block;font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.exbtn small{display:block;color:var(--mute);font-size:13px;margin-top:2px;line-height:1.3}
.ex .tgt{padding-top:3px}
.last{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px;color:var(--mute);margin:10px 0 0}
.last b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.goalln{font-size:14px;color:var(--mute);margin:4px 0 0}
.goalln b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prn{margin:10px 0 0;padding:8px 12px;border-radius:var(--r-s);background:var(--pos-bg);color:var(--pos);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ex .how{margin:10px 0 0}
.sets{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 54px 60px;gap:6px;align-items:center;margin-top:12px}
.sets .hd{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-left:2px}
.row{display:contents}
.no{font:700 17px/1 var(--f-display);color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.row.done .no{color:var(--pos)}
.row.done input{border-color:var(--pos-bg)}
.row.sk .no{text-decoration:line-through}
.sets input{text-align:center;padding:0 6px;font-variant-numeric:tabular-nums;font-weight:500}
.sets .btn{padding:0 4px;min-width:0}
.wu{grid-column:1/-1;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 0 6px;margin-bottom:2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.wu b{color:var(--ink);font-weight:600}
.sgl{grid-column:1/-1;font:600 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--chalk);padding-top:8px}
.exf{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.panel{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.panel input{background:var(--surface)}
.panel p{margin:0;font-size:14px}
.panel label{font-size:13px;color:var(--mute);font-weight:500}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 label{display:flex;flex-direction:column;gap:4px}
.skipcard{display:flex;flex-direction:column;gap:10px;background:var(--raise);border-style:dashed}
.skipcard p{margin:0}

/* Aktionsleiste, Timer, Hinweise */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 1px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.dk{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pgl{font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgl b{font:700 18px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.pbar{height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--pos);border-radius:6px;transition:width .25s}
.dk .btn{min-height:46px;padding:0 18px;font-size:16px}
.timer{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));
  max-width:600px;margin:0 auto;background:var(--chalk);color:var(--on-chalk);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
body.has-dock .timer{bottom:calc(var(--tab-h) + 78px + env(safe-area-inset-bottom,0px))}
.tmbar{height:4px;background:var(--track)}
.tmbar i{display:block;height:100%;width:0;background:var(--on-chalk)}
.tmrow{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"t l" "t b";column-gap:14px;row-gap:6px;align-items:center;padding:10px 12px 12px 14px}
.tmrow b{grid-area:t;font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:2.3em}
.tmrow>span{grid-area:l;min-width:0;font-size:14px;line-height:1.25;font-weight:600}
.tmrow>span small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.tmb{grid-area:b;display:flex;gap:6px;flex-wrap:wrap}
.tbtn{min-height:38px;padding:0 11px;border-radius:9px;border:1.5px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.timer.go{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
body.has-dock .toast{bottom:calc(var(--tab-h) + 90px + env(safe-area-inset-bottom,0px))}
body.has-timer .toast{bottom:calc(var(--tab-h) + 120px + env(safe-area-inset-bottom,0px))}
body.has-dock.has-timer .toast{bottom:calc(var(--tab-h) + 190px + env(safe-area-inset-bottom,0px))}
.toast.on{opacity:1}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;line-height:1.3;padding:6px 9px;border-radius:8px;box-shadow:var(--shadow);max-width:220px;transform:translate(-50%,-100%)}

/* Blätter (Einstellungen, Trainings-Zusammenfassung) */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-in{position:relative;width:100%;max-width:600px;max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{font:700 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.sheet-in p{margin:0;font-size:14.5px;max-width:60ch}
.setg{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.sumhero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.sumhero .si{width:60px;height:60px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:flex;align-items:center;justify-content:center}

/* Wochen */
details.wk>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.wk>summary::-webkit-details-marker{display:none}
.wkt{display:flex;flex-direction:column;gap:2px;min-width:0}
.wkt b{font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.wkt small{font-size:13px;color:var(--mute)}
.wks{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.wday{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.wday h4{margin:0 0 4px;font-size:14px;font-weight:600}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}
.lrow>span:first-child{min-width:0;overflow-wrap:anywhere}
.lrow .sv{display:flex;align-items:center;gap:8px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.x{min-height:32px;min-width:32px;border:1px solid transparent;border-radius:8px;background:none;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:0 6px}
.x:hover{border-color:var(--line)}
.x.arm{color:var(--neg);border-color:var(--neg)}
.wfoot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.wfoot label{font-size:13px;color:var(--mute);font-weight:500}

/* Vergleich und Diagramme */
.cmph{font-size:14px;margin:0 2px}
.cgroup h3{font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.cg{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:8px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.cg.hh{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-bottom:6px}
.cg b{font-weight:600}
.cg .m{font-size:12px}
.cg .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
details.cr{border-top:1px solid var(--line)}
details.cr>summary{list-style:none;cursor:pointer;padding:9px 0}
details.cr>summary::-webkit-details-marker{display:none}
.hs{padding:0 0 12px;display:flex;flex-direction:column;gap:2px}
.spark{margin:0 0 6px}
.spark svg,.chart{display:block;width:100%;height:auto;max-width:100%}
.spark .ar,.chart .ar{fill:var(--area)}
.spark .ln,.chart .ln{fill:none;stroke:var(--chalk);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .gd,.chart .gd{stroke:var(--line);stroke-width:1;fill:none}
.spark .pt,.chart .pt{fill:var(--chalk);stroke:var(--surface);stroke-width:2}
.spark figcaption{font-size:13px;color:var(--mute);margin-top:4px}
.chart .bar{fill:var(--chalk)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible{stroke:var(--chalk);stroke-width:1}
.chart .goal{stroke:var(--mute);stroke-width:1;fill:none}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--mute);font-variant-numeric:tabular-nums}
.chart text.vl{fill:var(--ink);font-weight:600}
.chart text.gl{font-size:10.5px}
.tbl{margin-top:8px;font-size:13.5px}
.tbl summary{cursor:pointer;color:var(--mute);font-weight:600;font-size:13px;padding:4px 0}
.tblw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.tbl th{font-weight:600;color:var(--mute);font-size:12px}
.tbl td:last-child,.tbl th:last-child{text-align:right}

/* Kalender */
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh .btn{min-width:52px;font-size:18px}
.cstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cstat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px}
.cstat b{font:700 26px/1 var(--f-body)}
.cstat span{font-size:12px;color:var(--mute);line-height:1.2}
.cmh{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;margin-bottom:6px;background:none;border:1px solid transparent;border-radius:10px;text-align:left;cursor:pointer}
.cmh[aria-pressed="true"]{background:var(--raise);border-color:var(--line)}
.cmh b{font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.cmh span{font-size:13px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute);padding-bottom:2px}
.cd{min-width:0;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.cd.tr{background:var(--chalk);color:var(--on-chalk);font-weight:700;border-color:var(--chalk)}
.cd.sk{border-style:dashed;color:var(--mute);text-decoration:line-through}
.cd.td{border-color:var(--ink);border-width:2px}
.cd[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.cl{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}

/* Flüssigere Bedienung */
html{-webkit-tap-highlight-color:transparent}
button,a,[data-a]{touch-action:manipulation}
.btn,.chip,.seg button,.hday,.gear,.cd,.rgr,.rmini,.wrow,.rbtn,.exr{transition:transform .14s ease,background-color .22s ease,border-color .22s ease,color .22s ease}
.btn:active,.chip:active,.seg button:active,.hday:active,.gear:active,.cd:active,.rgr:active,.rmini:active{transform:scale(.965)}
.tbi{transition:background-color .25s ease,transform .15s ease}
.tabbar button:active .tbi{transform:scale(.88)}
main.vin>*{animation:vin .46s cubic-bezier(.2,.8,.2,1) both}
main.vin>*:nth-child(2){animation-delay:.035s}main.vin>*:nth-child(3){animation-delay:.07s}main.vin>*:nth-child(4){animation-delay:.105s}
main.vin>*:nth-child(5){animation-delay:.14s}main.vin>*:nth-child(6){animation-delay:.175s}main.vin>*:nth-child(7){animation-delay:.21s}
main.vin>*:nth-child(n+8){animation-delay:.245s}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet:not([hidden]) .sheet-in{animation:shIn .36s cubic-bezier(.2,.85,.25,1)}
.sheet:not([hidden]) .sheet-bg{animation:fadeIn .25s ease}
.timer:not([hidden]){animation:shIn .36s cubic-bezier(.2,.85,.25,1)}
@keyframes shIn{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}}
.toast{transform:translate(-50%,10px);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.85,.25,1)}
.toast.on{transform:translate(-50%,0)}

/* Ladebildschirm beim Öffnen */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.spl{display:flex;flex-direction:column;align-items:center;gap:16px;animation:splIn .6s cubic-bezier(.2,.8,.2,1) both}
.spl-ic{color:var(--chalk);animation:splLift 1.2s ease-in-out infinite}
.spl b{font:700 17px/1 var(--f-display);letter-spacing:.26em;color:var(--ink);text-transform:uppercase;padding-left:.26em}
.spl-bar{width:128px;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.spl-bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--pos);animation:splBar .75s .1s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes splIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes splLift{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes splBar{to{width:100%}}

/* Rang */
.badge{display:block;flex:none;overflow:visible}
.badge .bnum{font:800 19px/1 var(--f-display);fill:#ffffff;paint-order:stroke;stroke:#000000;stroke-opacity:.35;stroke-width:2.5px}
.badge.glow{filter:drop-shadow(0 0 6px rgba(150,200,255,.45))}
.rprog{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:8px 0 4px}
.rprog i{display:block;height:100%;border-radius:3px;background:var(--mc,var(--chalk))}
.rmini{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.rmt{flex:1;min-width:0;display:flex;flex-direction:column}
.rmt b{font:700 21px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin-top:3px}
.rmt small{font-size:12.5px;color:var(--mute);line-height:1.3}
.chev{font-size:26px;color:var(--mute);line-height:1;flex:none}
.rhero{display:flex;align-items:center;gap:18px}
.rhero h2{font:700 28px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:4px 0 0}
.rht{flex:1;min-width:0}
.rht p{margin:2px 0 0;font-size:13px}
.rph{width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--raise);color:var(--mute);font:700 36px var(--f-display);flex:none}
.rph.sm{width:30px;height:30px;border-radius:8px;font-size:15px}
.rbody{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.rgl{display:flex;flex-direction:column;gap:3px;min-width:0}
.rgr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;border:1px solid transparent;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit;min-width:0}
.rgr.on{background:var(--raise);border-color:var(--line)}
.rgr>span{min-width:0}
.rgr b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.rgr small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .bside{width:140px;flex:none}
.rdet{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.rdh{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.rdh b{font-weight:600}
.rex{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rlad>summary{list-style:none;cursor:pointer}
.rlad>summary::-webkit-details-marker{display:none}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.lstep{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--raise);text-align:center;border:1px solid transparent}
.lstep.on{border-color:var(--ink)}
.lstep b{font-size:13px}
.lstep small{font-size:11.5px;color:var(--mute)}
/* 3D-Körpermodell: langsames Schwenken, Tippen dreht nach hinten */
.b3d{width:150px;height:315px;perspective:900px;cursor:pointer;touch-action:pan-y;margin:0 auto}
.b3d-tilt{width:100%;height:100%;transform-style:preserve-3d;animation:btilt 8s ease-in-out infinite}
@keyframes btilt{0%,100%{transform:rotateY(-10deg)}50%{transform:rotateY(10deg)}}
.b3d-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.75,.2,1)}
.b3d-flip.back{transform:rotateY(180deg)}
.b3d-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b3d-face.bk{transform:rotateY(180deg)}
.b3d svg{width:100%;height:100%;display:block;overflow:visible}
.bbase>*{fill:var(--raise);stroke:var(--line);stroke-width:1.5}
.mus>*{fill:var(--mc);stroke:var(--bg);stroke-width:1.2}
.mus.none>*{fill:var(--track)}
.mus.sel>*{stroke:var(--ink);stroke-width:2.6}
.det{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round}
/* Erholung kompakt */
.mgr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mt2{background:var(--raise);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.mt2 .mtop b{font-size:14.5px}
.mt2 .pc{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.mt2.ok .pc{color:var(--pos)}
.mt2.warn .pc{color:var(--warn)}
.mt2.neg .pc{color:var(--neg)}
.rbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:3px;background:var(--pos)}
.mt2.warn .rbar i{background:var(--warn)}

  if(prefs.sound&&ac){try{[0,.35,.7].forEach(function(d){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3);});}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){}
}
function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener&&l.addEventListener("release",function(){wl=null;});}).catch(function(){});}catch(e){}}
function unwake(){try{wl&&wl.release();}catch(e){}wl=null;}
function saveTimer(){if(tm)lsSet(KT,JSON.stringify({end:tm.end,total:tm.total,label:tm.label}));}
function startTimer(){var el=$("tm");el.hidden=false;document.body.classList.add("has-timer");el.classList.remove("go");$("tx").textContent="Überspringen";clearInterval(tm.iv);tick();tm.iv=setInterval(tick,250);}
function rest(sec,label){audio();if(tm)clearInterval(tm.iv);tm={end:Date.now()+sec*1000,total:sec*1000,label:label||"Pause",done:false};saveTimer();wake();startTimer();}
function tick(){
  if(!tm)return;var left=tm.end-Date.now(),r=Math.max(0,Math.ceil(left/1000));
  if(left<=0&&!tm.done){tm.done=true;clearInterval(tm.iv);beep();$("tm").classList.add("go");$("tx").textContent="OK";lsDel(KT);}
  $("tt").textContent=tm.done?"Los!":fmtT(r);
  $("tk").textContent=tm.done?"Pause vorbei":"Pause";
  $("tl").textContent=tm.label;
  $("tmf").style.width=(tm.done?100:Math.max(0,Math.min(100,(1-left/tm.total)*100)))+"%";
}
function nextLabel(s,tot){return s<tot-1?"Als Nächstes: Satz "+(s+2)+" bis zum Versagen":"Als Nächstes: nächste Übung mit Aufwärmsatz";}

function addT(s){if(!tm)return;if(tm.done){rest(s,"Zusätzliche Pause");return;}tm.end+=s*1000;tm.total+=s*1000;saveTimer();tick();}

/* ---------- Präzise Erholung: Stunden seit dem Training, Satzzahl und mitbelastete Muskeln ---------- */
var REC_BASE={"Brust":60,"Rücken":60,"Beine":72,"Schultern":48,"Bizeps":44,"Trizeps":44};
function secondary(n){
  var g=mgroup(n),t=exInfo(n,n).t,s=String(n).toLowerCase(),o={};
  if(/dip/.test(s)){o["Brust"]=.5;o["Schultern"]=.3;}
  else if(g==="Brust"&&t==="push"){o["Trizeps"]=.5;o["Schultern"]=.4;}
  else if(g==="Brust"){o["Schultern"]=.25;}
  else if(g==="Schultern"&&t==="push"){o["Trizeps"]=.5;}
  else if(g==="Rücken"){o["Bizeps"]=.5;o["Schultern"]=.25;}
  return o;
}
/* Trainingszeitpunkt: Zeit des Eintrags, wenn er am selben Tag gespeichert wurde, sonst 18 Uhr an dem Tag. */
function entryTime(x){if(x.u&&S(new Date(x.u))===x.d)return x.u;var p=P(x.d);p.setHours(18,0,0,0);return p.getTime();}
function recovery(){
  return memo("rec"+Math.floor(Date.now()/60000),function(){
    var now=Date.now(),td=today(),from=add(td,-7),ev={},R={};
    Object.keys(log).forEach(function(n){
      var g=mgroup(n),sec=secondary(n);
      log[n].forEach(function(x){
        if(x.d<from||x.d>td)return;var t=entryTime(x),sets=x.s.length;
        if(g)(ev[g]=ev[g]||[]).push({t:t,d:x.d,l:sets});
        Object.keys(sec).forEach(function(k){(ev[k]=ev[k]||[]).push({t:t,d:x.d,l:sets*sec[k]});});
      });
    });
    MG.forEach(function(g){
      var by={},p=1,left=0;
      (ev[g]||[]).forEach(function(e){var b=by[e.d]||(by[e.d]={t:0,l:0});b.l+=e.l;if(e.t>b.t)b.t=e.t;});
      Object.keys(by).forEach(function(d){
        var b=by[d];if(b.l<1)return;
        var H=REC_BASE[g]*Math.max(.6,Math.min(1.5,.6+b.l/8)),hs=Math.max(0,(now-b.t)/3.6e6),r=Math.min(1,hs/H);
        if(r<p){p=r;left=H-hs;}
      });
      R[g]={p:p,left:left};
    });
    return R;
  });
}
function recState(p){return p<.5?["neg","beansprucht"]:p<.9?["warn","erholt sich"]:["ok","erholt"];}
function fHours(h){return h<1?"unter 1 Std.":h<24?Math.ceil(h)+" Std.":NF1.format(Math.round(h/12)/2)+" Tagen";}
function relAgo(d){var n=daysAgo(d);return n<=0?"heute":n===1?"gestern":"vor "+n+" Tagen";}
/* Empfehlung: welcher Trainingstag passt zu den erholten Muskeln? */
function keyLoad(k){var w={},prim={};planList(k).forEach(function(it){var g=mgroup(it.n);if(g){w[g]=(w[g]||0)+it.s;prim[g]=1;}var sec=secondary(it.n);Object.keys(sec).forEach(function(s){w[s]=(w[s]||0)+it.s*sec[s];});});return {w:w,prim:prim};}
function readiness(k,R){
  var kl=keyLoad(k),sw=0,sr=0,min=1,minG=null;
  Object.keys(kl.w).forEach(function(g){sw+=kl.w[g];sr+=kl.w[g]*R[g].p;if(kl.prim[g]&&R[g].p<min){min=R[g].p;minG=g;}});
  return {r:sw?sr/sw:1,min:min,minG:minG};
}
function recommend(){
  var R=recovery(),td=today(),w=WD[P(td).getDay()],sched=DAYS.indexOf(w)>-1?(w==="Fr"?frv(td):w):null,ix=dateIndex(),recent={},best=null;
  for(var i=1;i<=2;i++){var d=add(td,-i);if(ix.by[d]){var kk=inferKey(d,ix.by[d]);if(kk)recent[kk]=1;}}
  ["Mo","Di","Do",frv(td),"Mi"].forEach(function(k,idx){
    var rd=readiness(k,R),sc=rd.r-(rd.min<.5?.35:rd.min<.75?.12:0)-(recent[k]?.4:0)-(k==="Mi"?.05:0)-idx*.001;
    if(!best||sc>best.sc)best={k:k,sc:sc,rd:rd};
  });
  return {R:R,sched:sched,sr:sched?readiness(sched,R):null,best:best};
}

function stepOf(s){
  if(s>=RT[8])return {st:24,f:1};
  for(var i=7;i>=0;i--){if(s>=RT[i]){var f=(s-RT[i])/(RT[i+1]-RT[i]),d=Math.min(2,Math.floor(f*3));return {st:i*3+d,f:Math.max(0,Math.min(1,f*3-d))};}}
  return {st:0,f:0};
}

function exRef(n){if(REF[n])return REF[n];var t=exInfo(n,n).t;return TREF[t]||.6;}
function loadOf(n,kg,bw){
  var s=String(n).toLowerCase();
  if(/assist/.test(s))return kg===null?null:Math.max(bw*.1,bw-kg);
  if(/(^|[\s(])dips?(\b|$)|klimmz|liegestütz|\bchin-?ups?\b|\bpull-?ups?\b/.test(s))return bw+(kg||0);
  return kg>0?kg:null;
}
function rankData(){
  return memo("rank",function(){
    var DEF=80,ex={},groups={},cut=add(today(),-84);
    Object.keys(log).forEach(function(n){
      var best=null,sets=0,recent=0;
      log[n].forEach(function(x){
        var bw=bwAt(x.d)||DEF;sets+=x.s.length;if(x.d>=cut)recent+=x.s.length;
        x.s.forEach(function(t){var L=loadOf(n,t[0],bw);if(!L||!(t[1]>0))return;var e=e1(L,Math.min(t[1],20)),ratio=e/bw;if(!best||ratio>best.ratio)best={ratio:ratio,w:t[0],r:t[1],d:x.d,e:e};});
      });
      if(!best)return;
      var s=best.ratio/exRef(n);
      ex[n]={s:s,rk:stepOf(s),best:best,g:mgroup(n),sets:sets,w:recent+1};
    });
    MG.forEach(function(g){
      var sw=0,ss=0,list=[],mx=0;
      Object.keys(ex).forEach(function(n){if(ex[n].g===g){list.push(n);if(ex[n].s>mx)mx=ex[n].s;}});

      list.forEach(function(n){var e=ex[n];e.out=e.s<mx*.35;if(!e.out){sw+=e.w;ss+=e.s*e.w;}});
      if(sw)groups[g]={s:ss/sw,rk:stepOf(ss/sw),ex:list.sort(function(a,b){return ex[b].s-ex[a].s;})};
    });

    var strong=gk.slice().sort(function(a,b){return groups[b].s-groups[a].s;})[0]||null;

  });
}

function checkRanks(){

  var h=vhead("Verlauf");
  h+='<div class="seg" role="group" aria-label="Ansicht"><button data-a="hist" data-v="k" aria-pressed="'+(ui.hist==="k")+'">Kalender</button><button data-a="hist" data-v="w" aria-pressed="'+(ui.hist==="w")+'">Wochen</button></div>';
  return h+(ui.hist==="w"?rWeeks():rCal());
}
function rWeeks(){
  var ix=dateIndex(),wk={};
  Object.keys(ix.by).concat(Object.keys(ix.sk)).forEach(function(d){(wk[mon(d)]=wk[mon(d)]||{})[d]=1;});
  Object.keys(weeks).forEach(function(m){if(weeks[m].c||weeks[m].n||weeks[m].v)wk[m]=wk[m]||{};});
  var cm=mon(today());if(!wk[cm])wk[cm]={};
  var ms=Object.keys(wk).sort().reverse();
  if(ms.length===1&&!Object.keys(wk[cm]).length&&!weeks[cm])return '<div class="card empty"><p><b>Noch keine Trainings gespeichert.</b></p><p class="m">Trag im Tab „Training“ deine Sätze ein. Jeder Satz wird automatisch gespeichert und erscheint hier nach Wochen sortiert.</p><button class="btn pri" data-a="view" data-v="t">Zum Training</button></div>';
  return ms.map(function(m,i){
    var ds=Object.keys(wk[m]).sort().reverse(),meta=weeks[m]||{},ntr=ds.filter(function(d){return ix.by[d];}).length,nsk=ds.filter(function(d){return ix.sk[d]&&!ix.by[d];}).length;
    var open=ui.wkOpen.hasOwnProperty(m)?ui.wkOpen[m]:i===0,wv=0;ds.forEach(function(d){(ix.by[d]||[]).forEach(function(x){wv+=svol(x[1]);});});
    var h='<details class="card wk" data-wk="'+m+'"'+(open?' open':'')+'><summary><span class="wkt"><b>KW '+kw(m)+'</b><small>'+fmt(m)+'–'+fmt(add(m,6))+' · '+ago(m)+(wv?' · '+fVol(wv):'')+'</small></span><span class="wks"><span class="pill">'+ntr+(ntr===1?' Training':' Trainings')+'</span>'+(nsk?'<span class="pill sk">'+nsk+' übersprungen</span>':'')+(meta.v?'<span class="pill warn">Urlaub</span>':'')+(meta.c?'<span class="pill ok">abgeschlossen ✓</span>':'')+'</span></summary>';
    if(!ds.length)h+='<p class="m" style="margin:12px 0 0;font-size:14px">'+(meta.v?'Urlaubswoche: Deine Serie läuft weiter.':'In dieser Woche ist noch nichts eingetragen.')+'</p>';
    ds.forEach(function(d){
      var du=getDur(d);
      h+='<div class="wday"><h4>'+WDL[P(d).getDay()]+', '+fmt(d)+(du?' <span class="m">· '+fDur(du)+'</span>':'')+(ix.sk[d]?' <span class="m">· Trainingstag übersprungen ('+esc(ix.sk[d])+')</span>':'')+'</h4>';
      (ix.by[d]||[]).forEach(function(x){
        var key=x[0]+"|"+d,arm=ui.delArm===key;
        h+='<div class="lrow"><span>'+esc(x[0])+'</span><span class="sv">'+x[1].map(setTxt).join(" · ")+(ro?'':'<button class="x'+(arm?' arm':'')+'" data-a="del" data-n="'+esc(x[0])+'" data-d="'+d+'" aria-label="'+(arm?'Löschen bestätigen':'Eintrag löschen')+'">'+(arm?'Löschen?':'✕')+'</button>')+'</span></div>';
      });
      if(!ro&&ix.by[d]){var da=ui.delArm==="D|"+d;h+='<div class="btnrow" style="margin-top:4px"><button class="x" data-a="hgo" data-d="'+d+'" data-k="'+(inferKey(d,ix.by[d])||"")+'">Bearbeiten</button><button class="x'+(da?' arm':'')+'" data-a="clrday" data-d="'+d+'">'+(da?'Wirklich alle Einträge löschen?':'Ganzen Tag löschen')+'</button></div>';}
      h+='</div>';
    });
    h+='<div class="wfoot"><label for="nt-'+m+'">Notiz zur Woche</label><input id="nt-'+m+'" maxlength="300" placeholder="z. B. Schulter gezwickt, Gym voll" value="'+esc(meta.n||"")+'"'+(ro?' disabled':'')+'>'
      +(ro?'':'<div class="btnrow"><button class="btn sm'+(meta.c?'':' pri')+'" data-a="close" data-w="'+m+'">'+(meta.c?'Woche wieder öffnen':'Woche abschließen ✓')+'</button><button class="btn sm ghost" data-a="vac" data-w="'+m+'">'+(meta.v?'Urlaub entfernen':'Als Urlaubswoche markieren')+'</button></div>')+'</div></details>';
    return h;
  }).join("");
}
function cntM(ix,ym){var n=0,s=0;Object.keys(ix.by).forEach(function(d){if(d.slice(0,7)===ym)n++;});Object.keys(ix.sk).forEach(function(d){if(d.slice(0,7)===ym&&!ix.by[d])s++;});return [n,s];}
function calMonth(ix,y,mo,td){
  var ym=y+"-"+String(mo+1).padStart(2,"0"),dim=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,c=cntM(ix,ym);
  var h='<section><button class="cmh" data-a="calf" data-m="'+ym+'" aria-pressed="'+(ui.calF===ym)+'"><b>'+MN[mo]+' '+y+'</b><span>'+c[0]+(c[0]===1?' Training':' Trainings')+(c[1]?' · '+c[1]+' übersprungen':'')+'</span></button>';
  h+='<div class="cal">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(function(x){return '<span class="cw" aria-hidden="true">'+x+'</span>';}).join("");
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=dim;d++){
    var ds=ym+"-"+String(d).padStart(2,"0"),cl="cd"+(ix.by[ds]?" tr":ix.sk[ds]?" sk":"")+(ds===td?" td":"");
    h+='<button class="'+cl+'" data-a="cald" data-d="'+ds+'" aria-pressed="'+(ds===ui.calSel)+'" aria-label="'+d+'. '+MN[mo]+(ix.by[ds]?', Training':ix.sk[ds]?', übersprungen':'')+(ds===td?', heute':'')+'">'+d+'</button>';
  }
  return h+'</div></section>';
}
function rCal(){
  var ix=dateIndex(),y=+ui.calM.slice(0,4),mo=+ui.calM.slice(5,7)-1,td=today();
  var d2=new Date(y,mo+1,1),ym1=ui.calM.slice(0,7),ym2=S(d2).slice(0,7);
  if(ui.calF!==ym1&&ui.calF!==ym2)ui.calF=ym2;
  var cf=cntM(ix,ui.calF),fy=+ui.calF.slice(0,4),fm=+ui.calF.slice(5,7)-1,fdim=new Date(fy,fm+1,0).getDate();
  var days=ui.calF<td.slice(0,7)?fdim:ui.calF===td.slice(0,7)?+td.slice(8,10):0;
  var h='<div class="calh"><button class="btn" data-a="cal" data-v="-1" aria-label="Früherer Monat">‹</button><button class="btn" data-a="calnow">Heute</button><button class="btn" data-a="cal" data-v="1" aria-label="Späterer Monat">›</button></div>';
  h+='<div class="cstat"><div><b>'+cf[0]+'</b><span>Trainings im '+MN[fm]+'</span></div><div><b>'+(days?NF1.format(cf[0]/(days/7)):'–')+'</b><span>pro Woche'+(ui.calF===td.slice(0,7)?' bisher':'')+'</span></div><div><b>'+cf[1]+'</b><span>übersprungen</span></div></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:14px">'+calMonth(ix,y,mo,td)+calMonth(ix,d2.getFullYear(),d2.getMonth(),td)+'</div>';
  var sel=ui.calSel&&(ui.calSel.slice(0,7)===ym1||ui.calSel.slice(0,7)===ym2)?ui.calSel:null;
  if(sel){
    var di=dayInfo(sel,ix);
    h+='<div class="card"><div class="ch" style="margin-bottom:4px"><h2 style="font-size:17px">'+esc(longDate(sel))+'</h2>'+(ix.by[sel]?'<span class="m">'+fVol(di.vol)+(di.dur?' · '+fDur(di.dur):'')+'</span>':'')+'</div>';
    if(ix.by[sel])h+='<ul class="cl">'+ix.by[sel].map(function(x){return '<li>'+esc(x[0])+' <span class="m">'+x[1].map(setTxt).join(" · ")+'</span></li>';}).join("")+'</ul>';
    else if(ix.sk[sel])h+='<p class="m" style="margin:6px 0 0">Trainingstag übersprungen ('+esc(ix.sk[sel])+')</p>';
    else h+='<p class="m" style="margin:6px 0 0">Kein Training an diesem Tag.</p>';
    if(!ro&&sel<=td)h+='<div style="margin-top:12px"><button class="btn sm" data-a="calgo" data-d="'+sel+'" data-k="'+(ix.by[sel]?inferKey(sel,ix.by[sel])||"":"")+'">Diesen Tag im Training öffnen</button></div>';
    h+='</div>';
  }
  var B=[],nw=new Date();
  for(var k=5;k>=0;k--){var dd=new Date(nw.getFullYear(),nw.getMonth()-k,1),cc=cntM(ix,S(dd).slice(0,7))[0];B.push({l:MN[dd.getMonth()].slice(0,3),tl:MN[dd.getMonth()]+" "+dd.getFullYear(),v:cc,t:MN[dd.getMonth()]+" "+dd.getFullYear()+": "+cc+(cc===1?" Training":" Trainings")});}
  h+='<section class="card"><div class="ch"><h2>Trainings pro Monat</h2></div>'+barChart(B,{aria:"Trainings pro Monat, letzte 6 Monate",fmt:function(v){return NF0.format(v);},tick:function(v){return NF1.format(v);}})+tableTwin(B,"Monat","Trainings",function(v){return NF0.format(v);})+'</section>';
  return h;
}

/* ---------- Blätter: Einstellungen und Zusammenfassung ---------- */
function renderSheet(){
  var open=!!ui.sheet;$("sheet").hidden=!open;document.body.classList.toggle("has-sheet",open);
  $("sheet-in").innerHTML=open?(ui.sheet==="sum"?sumHtml():ui.sheet==="meas"?measHtml():ui.sheet==="ex"?exHtml(ui.exN):setHtml()):"";
}

  var ne=0;Object.keys(log).forEach(function(n){ne+=log[n].length;});
  return '<div class="sh"><h2 id="sheet-t">Daten & Design</h2><button class="btn sm ghost" data-a="shut">Schließen</button></div>'

    +'<p class="m">Gespeichert: '+ne+' Einträge zu '+Object.keys(log).length+' Übungen, '+bwList().length+' Gewichtseinträge.</p>'
    +'<div class="setg"><h3 class="lbl">Wochenziel</h3><div class="seg sm" role="group" aria-label="Wochenziel">'+[3,4,5].map(function(g){return '<button data-a="goal" data-v="'+g+'" aria-pressed="'+(prefs.goal===g)+'">'+g+' Trainings</button>';}).join("")+'</div><p class="m">Zählt für Wochenring, Serie und Erfolge.</p></div>'
    +(ro?'':'<div class="setg"><h3 class="lbl">Urlaubsmodus</h3><p class="m">Markiert die aktuelle Woche als Urlaub oder Pause, zum Beispiel bei Krankheit. Deine Serie bleibt dann erhalten.</p><div><button class="btn sm" data-a="vac" data-w="'+mon(today())+'">'+(isVac(mon(today()))?'Urlaub für diese Woche beenden':'Diese Woche als Urlaub markieren')+'</button></div></div>')
    +'<div class="setg"><h3 class="lbl">Sicherung</h3>'+(APP?'<p class="m">'+(+lsGet(KB)?'Letzte Sicherung: '+esc(fmtY(S(new Date(+lsGet(KB)))))+'.':'Noch keine Sicherung in dieser App.')+'</p>':'')+'<div class="btnrow"><button class="btn sm" data-a="export">'+(dl||APP?'Daten sichern (.json)':'Daten kopieren (JSON)')+'</button>'+(ro?'':'<button class="btn sm" data-a="import">Sicherung importieren</button>')+'</div>'
    +(ui.importMsg?'<p>'+esc(ui.importMsg)+'</p>':'<p class="m">Beim Import kommen nur Einträge dazu, die hier noch fehlen. Vorhandenes wird nicht überschrieben.</p>')+'</div>'
    +'<div class="setg"><h3 class="lbl">Design</h3><div class="seg sm" role="group" aria-label="Design">'+[["dark","Dunkel"],["light","Hell"],["auto","Wie System"]].map(function(x){return '<button data-a="look" data-v="'+x[0]+'" aria-pressed="'+(prefs.look===x[0])+'">'+x[1]+'</button>';}).join("")+'</div></div>'
    +'<div class="setg"><h3 class="lbl">Pausen-Timer</h3><div class="seg sm" role="group" aria-label="Ton am Pausenende"><button data-a="sound" data-v="1" aria-pressed="'+prefs.sound+'">Ton an</button><button data-a="sound" data-v="0" aria-pressed="'+!prefs.sound+'">Nur Vibration</button></div></div>';
}

  var kc=kcalFor(d,ui.sum.dur);

  if(ui.sumTxt)h+='<label class="vh" for="sumtxt">Trainingsbericht</label><textarea id="sumtxt" class="sumtxt" readonly rows="8">'+esc(sumText(d,ui.sum.dur))+'</textarea>';
  return h+'<button class="btn pri wide lg" data-a="sumdone">Fertig</button>';

/* ---------- Aktionen ---------- */
function setDate(d){
  flushDrafts();
  ui.tdate=d&&DRE.test(d)&&d<=today()?d:today();
  var w=WD[P(ui.tdate).getDay()];if(DAYS.indexOf(w)>-1)ui.day=w;
  ui.frPick=null;ui.sw=null;ui.addOpen=false;draft={};extra={};
}
function openDay(d,k){
  setDate(d);
  if(k==="FA"||k==="FB"){ui.day="Fr";ui.frPick=k!==frv(ui.tdate)?k:null;}
  else if(k&&DAYS.indexOf(k)>-1)ui.day=k;
  ui.view="t";
}
function swApply(k,i,val,scope){
  var list=exList(k),it=list[i];if(!it)return;
  val=clean(val);if(!val){toast("Bitte einen Namen eingeben");return;}
  if(val!==it.n&&list.some(function(x,j){return j!==i&&x.n===val;})){toast("„"+val+"“ ist an diesem Tag schon im Plan");return;}
  var o=it.o,cur=it.n;
  if(scope==="all"||keysWith(o).length<2){
    if(val===o)delete SW[o];else SW[o]=val;
    Object.keys(SWD).forEach(function(kk){delete SWD[kk][o];if(!Object.keys(SWD[kk]).length)delete SWD[kk];});
  }else{
    var base=SW[o]||o;SWD[k]=SWD[k]||{};
    if(val===base)delete SWD[k][o];else SWD[k][o]=val;
    if(!Object.keys(SWD[k]).length)delete SWD[k];
  }
  if(val!==cur&&draft[cur]){draft[val]=draft[cur];delete draft[cur];if(extra[cur]){extra[val]=extra[cur];delete extra[cur];}}
  /* Schon gespeicherte Sätze von heute wandern mit zur neuen Übung, damit nichts doppelt unter zwei Namen liegt. */
  if(val!==cur&&entryOn(cur,ui.tdate)){clearTimeout(asT[cur]);delete asT[cur];putEntry(cur,ui.tdate,[]);if(draft[val])saveEx(val);}
  swT=Date.now();swDirty=true;ui.sw=null;persist();render();
  toast(val===o?"Original wiederhergestellt":"Getauscht: "+val);
}
function focusSheet(){var b=$("sheet-in").querySelector("button");if(b)b.focus();}

document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-a]"):null;if(!t||t.disabled)return;
  var a=t.getAttribute("data-a"),k=curKey(),x=+t.getAttribute("data-x"),it,n;
  if(a==="view"){ui.view=t.getAttribute("data-v");ui.sw=null;ui.addOpen=false;render();window.scrollTo(0,0);}
  else if(a==="settings"){ui.sheet="set";render();focusSheet();}
  else if(a==="shut"){var wasSum=ui.sheet==="sum";ui.sheet=null;ui.sum=null;render();if(wasSum)window.scrollTo(0,0);}
  else if(a==="sumdone"){ui.sheet=null;ui.sum=null;ui.view="h";ui.hsel=today();render();window.scrollTo(0,0);}
  else if(a==="hsel"){ui.hsel=t.getAttribute("data-d");render();}
  else if(a==="hgo"||a==="calgo"){
    var hd=t.getAttribute("data-d"),hk0=t.getAttribute("data-k")||"";
    openDay(hd,hk0);if(a==="hgo"&&ui.tdate===today()&&!dateIndex().by[ui.tdate])startSess(ui.tdate);
    render();window.scrollTo(0,0);
  }
  else if(a==="how"){
    var hk=t.getAttribute("data-h"),p=document.querySelector('[data-hp="'+hk+'"]');
    ui.openHow[hk]=!ui.openHow[hk];if(p)p.hidden=!ui.openHow[hk];t.setAttribute("aria-expanded",String(!!ui.openHow[hk]));
  }
  else if(a==="planfr"){ui.planFr=t.getAttribute("data-v");render();}
  else if(a==="go"){
    ui.day=t.getAttribute("data-d");
    if(ui.day==="Fr"){var pk=t.getAttribute("data-k");ui.frPick=pk!==frv(ui.tdate)?pk:null;}
    ui.view="t";ui.sw=null;ui.addOpen=false;if(ui.tdate===today())startSess(ui.tdate);render();window.scrollTo(0,0);
  }
  else if(a==="day"){ui.day=t.getAttribute("data-d");ui.frPick=null;ui.sw=null;ui.addOpen=false;render();}
  else if(a==="frpick"){var v=t.getAttribute("data-v");ui.frPick=v===frv(ui.tdate)?null:v;ui.sw=null;render();}
  else if(a==="dtnow"){setDate(today());render();}
  else if(a==="dtstep"){setDate(add(ui.tdate,+t.getAttribute("data-v")));render();}
  else if(a==="dtgo"){setDate(t.getAttribute("data-d"));render();}
  else if(a==="clrday"){
    var cd=t.getAttribute("data-d"),dk2="D|"+cd;
    if(ui.delArm!==dk2){ui.delArm=dk2;render();clearTimeout(delT);delT=setTimeout(function(){if(ui.delArm===dk2){ui.delArm=null;if(!editing())render();}},4000);return;}
    ui.delArm=null;var cn=0;
    Object.keys(log).forEach(function(nm){if(entryOn(nm,cd)){putEntry(nm,cd,[]);cn++;}});
    if(cd===ui.tdate){Object.keys(asT).forEach(function(z){clearTimeout(asT[z]);});asT={};draft={};extra={};if(ui.oneoff)delete ui.oneoff[cd];}
    if(getDur(cd)){var wo=weeks[mon(cd)],du=clone(wo.du);delete du[cd];weekSet(mon(cd),{du:du});}
    if(session&&session.d===cd){session=null;saveSess();}
    if(cn)persist();render();toast(cn?"Alle Eingaben vom "+fmt(cd)+" gelöscht":"Am "+fmt(cd)+" war nichts eingetragen");
  }
  else if(a==="adscope"){
    ui.addScope=t.getAttribute("data-v");
    document.querySelectorAll('[data-a="adscope"]').forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===ui.addScope));});
  }
  else if(a==="rest"){rest(+t.getAttribute("data-s"),t.getAttribute("data-l"));}
  else if(a==="tmx"){stopT();}
  else if(a==="tmadd"){addT(30);}
  else if(a==="finish"){
    flushDrafts();exList(k).forEach(function(q){saveEx(q.n);});
    var fd=ui.tdate;
    if(!dateIndex().by[fd]){toast("Noch nichts eingetragen");return;}
    var dur=null;
    if(session&&session.d===fd){dur=Math.round(Math.min(Date.now()-session.start,4*3600e3)/1000);if(dur>=60){setDur(fd,dur);}else dur=getDur(fd);session=null;saveSess();persist();}
    else dur=getDur(fd);
    if(db&&!ro){clearTimeout(flushT);flush();}
    ui.sum={d:fd,dur:dur};ui.sumTxt=false;ui.sheet="sum";render();focusSheet();
  }
  else if(a==="skip"){
    it=exList(k)[x];if(!it)return;n=it.n;var si=+t.getAttribute("data-i"),d=draft[n]||(draft[n]=[]),r=d[si]||["",""];
    d[si]=r[2]?[r[0],r[1]]:[r[0],r[1],1];
    clearTimeout(asT[n]);delete asT[n];saveEx(n);render();
  }
  else if(a==="addset"){it=exList(k)[x];if(!it)return;if((extra[it.n]||0)<4){extra[it.n]=(extra[it.n]||0)+1;render();var f=$("in-"+x+"-"+(it.s+extra[it.n]-1)+"-0");if(f)f.focus();}else toast("Mehr als 4 Zusatzsätze gehen nicht");}
  else if(a==="rmset"){it=exList(k)[x];if(!it||!extra[it.n])return;n=it.n;if(draft[n])draft[n].length=Math.min(draft[n].length,it.s+extra[n]-1);extra[n]--;clearTimeout(asT[n]);delete asT[n];saveEx(n);render();}
  else if(a==="fill"){
    it=exList(k)[x];if(!it)return;n=it.n;var l=prevOf(n,ui.tdate),tot=it.s+(extra[n]||0),tg=targets(n,it,l,tot);if(!tg)return;
    var dr=draft[n]||(draft[n]=[]),c=0;
    for(var s=0;s<tot;s++){var tt=tg.t[s];if(!dr[s])dr[s]=["",""];if(dr[s][0]===""&&tt&&tt[0]!==null){dr[s][0]=String(tt[0]).replace(".",",");c++;}}
    render();if(!c)toast("Gewichte sind schon eingetragen");
    for(var s2=0;s2<tot;s2++){var inp=$("in-"+x+"-"+s2+"-1");if(inp&&!inp.value&&!inp.disabled){inp.focus();break;}}
  }
  else if(a==="sw"){
    var same=ui.sw&&ui.sw.k===k&&ui.sw.i===x;ui.sw=same?null:{k:k,i:x};ui.swScope="day";ui.rmArm=false;render();

function exportData(){
  flushDrafts();
  var data=JSON.stringify({app:"trainings-tracker",v:5,exportiert:new Date().toISOString(),log:log,weeks:weeks,sw:SW,swd:SWD,ad:AD,hd:HD,od:OD,bw:BW,bm:BM,pv:planV},null,1),fn="trainings-tracker-"+today()+".json";
  if(dl){dl.save({filename:fn,data:data}).then(function(r){markBackup();toast(r&&r.status==="delivered"?"Sicherung übergeben":"Sicherung gespeichert");}).catch(function(e){toast(e&&e.code==="declined"?"Sicherung abgebrochen":e&&e.code==="rate_limited"?"Bitte kurz warten und erneut versuchen":"Sicherung ist hier nicht möglich");});return;}
  /* Eigenständige App (Home-Bildschirm): Datei über das Teilen-Menü („In Dateien sichern“) oder als Download speichern. */
  if(APP){
    var dlBlob=function(){try{var url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);markBackup();toast("Sicherung gespeichert");}catch(e){toast("Sicherung ist hier nicht möglich");}};
    try{
      var file=new File([data],fn,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:"Trainings-Sicherung"}).then(function(){markBackup();toast("Sicherung gespeichert");}).catch(function(e){if(e&&e.name==="AbortError")toast("Sicherung abgebrochen");else dlBlob();});
        return;
      }
    }catch(e){}

  }
  try{navigator.clipboard.writeText(data).then(function(){toast("Daten in die Zwischenablage kopiert");}).catch(function(){toast("Kopieren ist hier nicht möglich");});}catch(e){toast("Kopieren ist hier nicht möglich");}
}
function markBackup(){lsSet(KB,String(Date.now()));if(ui.view==="h"&&!ui.sheet)render();}
function importFile(f){
  if(!f)return;
  if(f.size>5e6){ui.importMsg="Die Datei ist zu groß für eine Trainings-Sicherung.";render();return;}
  var r=new FileReader();
  r.onload=function(){
    var o;try{o=JSON.parse(String(r.result));}catch(e){ui.importMsg="Die Datei ist keine gültige Sicherung. Wähle eine .json-Datei aus „Daten sichern“.";render();return;}
    if(!o||typeof o!=="object"||!o.log){ui.importMsg="In der Datei wurden keine Trainingsdaten gefunden.";render();return;}
    var il=cleanLog(o.log),iw=cleanWeeks(o.weeks),ib=cleanBw(o.bw),now=Date.now(),addE=0,addW=0,addB=0;
    Object.keys(il).forEach(function(n){il[n].forEach(function(x){
      if(entryOn(n,x.d))return;var a=(log[n]||[]).slice();a.push({d:x.d,s:x.s,u:now});a.sort(byD);log[n]=a;delete rm[n+"|"+x.d];mark(x.d.slice(0,4));addE++;
    });});
    Object.keys(iw).forEach(function(k){if(weeks[k])return;var w=iw[k];w.t=now;weeks[k]=w;mark(k.slice(0,4));addW++;});
    Object.keys(ib).forEach(function(d){if(BW[d]||ib[d].v===null)return;BW[d]={v:ib[d].v,u:now};addB++;});
    var ibm=cleanBm(o.bm);Object.keys(ibm).forEach(function(d){if(BM[d]||!ibm[d].v)return;BM[d]={v:ibm[d].v,u:now};addB++;});
    /* Plan-Änderungen (Tauschen, Hinzufügen, Entfernen, Reihenfolge) aus neueren Sicherungen übernehmen, wenn hier noch keine gemacht wurden. */
    var noLocalPlan=![SW,SWD,AD,HD,OD].some(function(m){return Object.keys(m).length;}),addP=0;
    if((+o.pv||1)>=PLANV&&noLocalPlan){
      var isw=cleanMap(o.sw),iswd=cleanSwd(o.swd),iad=cleanAd(o.ad),ihd=cleanHd(o.hd),iod=cleanHd(o.od);
      if([isw,iswd,iad,ihd,iod].some(function(m){return Object.keys(m).length;})){SW=isw;SWD=iswd;AD=iad;HD=ihd;OD=iod;swT=now;swDirty=true;addP=1;addB+=0;}
    }
    if(addB)bwDirty=true;
    ui.importMsg=addE||addW||addB||addP?"Import fertig: "+addE+(addE===1?" Eintrag":" Einträge")+(addW?", "+addW+(addW===1?" Woche":" Wochen"):"")+(addB?", "+addB+(addB===1?" Körpereintrag":" Körpereinträge"):"")+(addP?" und deine Plan-Änderungen":"")+" übernommen.":"Alles aus dieser Datei ist schon vorhanden.";
    if(addE||addW||addB||addP)persist();
    render();toast(ui.importMsg);
  };
  r.onerror=function(){ui.importMsg="Die Datei konnte nicht gelesen werden.";render();};
  r.readAsText(f);
}
